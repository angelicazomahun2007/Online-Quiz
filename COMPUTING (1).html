<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computing & Data Mining Quiz Ledger</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --incorrect: #dc2626;
      --incorrect-bg: #fef2f2;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      font-size: 1.875rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    /* Score Ledger Summary */
    .ledger-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .ledger-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .ledger-card h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ledger-card .score {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      min-width: 180px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: #f1f5f9;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Quiz Card Area */
    .quiz-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .question-number {
      font-weight: bold;
      color: var(--primary);
    }

    .question-text {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 14px 18px;
      text-align: left;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect);
      color: var(--incorrect);
      font-weight: 600;
    }

    .option-btn.show-correct {
      border-color: var(--correct);
      background-color: var(--correct-bg);
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 8px;
      background-color: #f1f5f9;
      border-left: 4px solid var(--primary);
      display: none;
    }

    .explanation-box.active {
      display: block;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Computing & Data Mining Quiz Ledger</h1>
    <p>Assessment platform for Big Data, CRISP-DM Framework & Database Normalization (35 questions)</p>
  </header>

  <!-- Summary Ledger -->
  <div class="ledger-summary">
    <div class="ledger-card">
      <h3>Overall Progress</h3>
      <div class="score" id="total-progress">0 / 35</div>
    </div>
    <div class="ledger-card">
      <h3>Overall Accuracy</h3>
      <div class="score" id="overall-accuracy">0%</div>
    </div>
    <div class="ledger-card">
      <h3>Current Set Score</h3>
      <div class="score" id="current-set-score">0 / 20</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchSet(0)">Set 1: Big Data & CRISP-DM</button>
    <button class="tab-btn" onclick="switchSet(1)">Set 2: Database & Normalization</button>
  </div>

  <!-- Quiz Card Area -->
  <div class="quiz-card">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-header">
      <span class="question-number" id="question-number">Question 1 of 20</span>
      <span id="set-title-badge" style="font-size: 0.85rem; color: var(--text-muted);">Set 1</span>
    </div>

    <div class="question-text" id="question-text">Loading question...</div>

    <div class="options-grid" id="options-grid"></div>

    <div class="explanation-box" id="explanation-box">
      <strong>Explanation / Key Concept:</strong>
      <p id="explanation-text"></p>
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="controls">
    <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
    <button class="btn btn-secondary" onclick="resetCurrentSet()">Reset Set</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next Question</button>
  </div>
</div>

<script>
// Quiz Data (35 questions across 2 sets)
const quizData = [
  // SET 1
  {
    setTitle: "Set 1: Big Data & CRISP-DM",
    questions: [
      {
        question: "1. What is Big Data?",
        options: [
          "Small amounts of information",
          "Data that cannot be processed by traditional database tools",
          "Only numerical data",
          "Data that is always free to access"
        ],
        correct: 1,
        explanation: "Big Data refers to data sets that are too large or complex to be dealt with by traditional data-processing application software."
      },
      {
        question: "2. Which of the following is a characteristic of Big Data?",
        options: ["Volume", "Color", "Shape", "Texture"],
        correct: 0,
        explanation: "The core characteristics (V's) of Big Data include Volume, Velocity, Variety, Veracity, and Value."
      },
      {
        question: "3. Which of the following technologies contributes to the growth of Big Data?",
        options: ["Steam engines", "Internet of Things (IoT)", "Typewriters", "Pencil and paper"],
        correct: 1,
        explanation: "IoT devices continuously generate huge volumes of real-time sensor data, driving Big Data growth."
      },
      {
        question: "4. What role do social media platforms play in Big Data? They",
        options: [
          "decrease data collection",
          "generate large volumes of user-generated data",
          "do not affect Big Data",
          "only store text data"
        ],
        correct: 1,
        explanation: "Social media platforms collect massive amounts of user-generated unstructured/semi-structured data daily."
      },
      {
        question: "5. Which of the following is not a benefit of Big Data?",
        options: [
          "Improved decision-making",
          "Higher security risks",
          "Enhanced customer experiences",
          "Better predictive analytics"
        ],
        correct: 1,
        explanation: "Higher security risks are a potential drawback or challenge of managing Big Data, not a benefit."
      },
      {
        question: "6. Which term describes the analysis of large sets of data to discover patterns and trends? Data",
        options: ["sorting", "mining", "manual", "ignoring"],
        correct: 1,
        explanation: "Data mining involves extracting meaningful patterns and knowledge from extensive datasets."
      },
      {
        question: "7. What type of analytics helps in predicting future events?",
        options: ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"],
        correct: 2,
        explanation: "Predictive analytics utilizes statistical models and forecast techniques to project future outcomes."
      },
      {
        question: "8. Predictive Analytics often uses techniques from which field?",
        options: ["Statistics and machine learning", "Accounting", "Sociology", "Literature"],
        correct: 0,
        explanation: "Predictive analytics heavily relies on statistical algorithms and machine learning methodologies."
      },
      {
        question: "9. What kind of data does Diagnostic Analytics focus on?",
        options: ["Future", "Real-time", "Historical", "Forecasted"],
        correct: 2,
        explanation: "Diagnostic analytics examines historical data to understand 'why' something happened."
      },
      {
        question: "10. Which of the following best describes Prescriptive Analytics?",
        options: [
          "Describes past interactions and their effects",
          "Suggests actions to achieve desired outcomes",
          "Predicts future scenarios",
          "Only analyzes current data"
        ],
        correct: 1,
        explanation: "Prescriptive analytics recommends specific course-of-action choices to achieve optimal targets."
      },
      {
        question: "11. What does CRISP-DM stand for?",
        options: [
          "Cross-Industry Standard Process for Data Mining",
          "Cross-Reference Integrated Standard Process for Digital Marketing",
          "Centralized Research and Information System for Data Management",
          "Created Research Integrated System for Data Management"
        ],
        correct: 0,
        explanation: "CRISP-DM stands for Cross-Industry Standard Process for Data Mining, a widely used analytics methodology."
      },
      {
        question: "12. Which phase of the CRISP-DM framework focuses on understanding the project objectives and requirements?",
        options: ["Data Preparation", "Business Understanding", "Data Mining", "Deployment"],
        correct: 1,
        explanation: "Business Understanding is the initial phase prioritizing goals and requirements from a business perspective."
      },
      {
        question: "13. What is the main goal of the Data Understanding phase in CRISP-DM?",
        options: [
          "To conduct first tests",
          "To collect and explore the data",
          "To deploy the model",
          "To clean the data"
        ],
        correct: 1,
        explanation: "Data Understanding focuses on initial data collection, identifying quality issues, and discovering first insights."
      },
      {
        question: "14. What does the Data Preparation phase involve?",
        options: [
          "Writing the final report",
          "Selecting and cleaning data for analysis",
          "Training a machine learning model",
          "Collecting raw data without any organization"
        ],
        correct: 1,
        explanation: "Data Preparation covers constructing the final dataset (cleaning, transforming, selecting) from raw data."
      },
      {
        question: "15. In CRISP-DM, which phase follows Data Preparation?",
        options: ["Business Understanding", "Knowledge Discovery", "Data Mining", "Evaluation"],
        correct: 2,
        explanation: "Data Preparation is followed by the Modeling (or Data Mining execution) stage."
      },
      {
        question: "16. The purpose of the Modeling phase in CRISP-DM is to",
        options: [
          "Prepare the data for analysis",
          "Create and assess models for analysis",
          "Implement the final model",
          "Present results to stakeholders"
        ],
        correct: 1,
        explanation: "The Modeling phase selects and applies various modeling techniques to calibrate parameters."
      },
      {
        question: "17. What is the focus of the Evaluation phase in CRISP-DM? To",
        options: [
          "summarize data findings",
          "assess the model's effectiveness and ensure it meets business objectives",
          "create new models",
          "deploy the model in production"
        ],
        correct: 1,
        explanation: "Evaluation ensures that the construct constructed properly satisfies original business objectives."
      },
      {
        question: "18. In the Deployment phase of CRISP-DM, what primarily happens?",
        options: [
          "The model is tested again",
          "Results are presented to stakeholders",
          "The model is implemented and used for decision-making",
          "Data is archived"
        ],
        correct: 2,
        explanation: "Deployment integrates model outputs into operational decision-making environments."
      },
      {
        question: "19. Which phase would you associate with choosing the right techniques for analysis?",
        options: ["Data Preparation", "Modeling", "Evaluation", "Deployment"],
        correct: 1,
        explanation: "Selecting statistical and algorithmic techniques is performed during the Modeling phase."
      },
      {
        question: "20. CRISP-DM is best described as a",
        options: [
          "linear process for data analysis",
          "circular process that allows for iterations",
          "strict methodology with no flexibility",
          "one-time project guideline"
        ],
        correct: 1,
        explanation: "CRISP-DM is an iterative, non-linear methodology where phases frequently loop back based on feedback."
      }
    ]
  },
  // SET 2
  {
    setTitle: "Set 2: Database & Normalization",
    questions: [
      {
        question: "21. Big data can effectively be analysed in spreadsheets.",
        options: ["True", "False"],
        correct: 1,
        explanation: "False. Traditional spreadsheets cannot handle the volume, velocity, and complexity of Big Data."
      },
      {
        question: "22. The principle of atomicity requires that relational database tables serve a single purpose.",
        options: ["True", "False"],
        correct: 1,
        explanation: "False. Atomicity in database normalization means attribute fields contain single indivisible values, not multi-valued items."
      },
      {
        question: "23. Full dependency literally means that a relational database table should be a multiple-purpose table.",
        options: ["True", "False"],
        correct: 1,
        explanation: "False. Full functional dependency dictates that non-key attributes must depend on the entire primary key."
      },
      {
        question: "24. To adhere to the principles of normalization, a column of a database table must store single values only.",
        options: ["True", "False"],
        correct: 0,
        explanation: "True. First Normal Form (1NF) explicitly requires columns to store atomic (single) values."
      },
      {
        question: "25. The process of uncovering patterns and other valuable information from large data sets (Big Data) is referred to as",
        options: ["Big data analytics", "Knowledge discovery in data"],
        correct: 1,
        explanation: "Knowledge Discovery in Data (KDD) or Data Mining is the structured process of discovering patterns in datasets."
      },
      {
        question: "26. Which of the following is not an importance of data mining?",
        options: [
          "Identify most likely buyers of new products and services",
          "Forecast consumption levels of different product types",
          "Identify commonalities and anomalies in production systems",
          "Improve the ethical behaviour of employees"
        ],
        correct: 3,
        explanation: "Data mining analyzes patterns in data; it cannot directly monitor or improve personal human morality/ethics."
      },
      {
        question: "27. The cross-industry process for data mining suggests six-steps process for carrying out data mining. Which of the following is one of them?",
        options: [
          "Recruitment of people",
          "Training of people",
          "Motivating people",
          "Understanding of the business"
        ],
        correct: 3,
        explanation: "Business Understanding is step 1 of the six-step CRISP-DM process."
      },
      {
        question: "28. Cluster analysis as a data mining method involves",
        options: [
          "Processing data into groups on the basis of how closely associated they are",
          "The process of predicting the values of a response variable from predictor variable(s)",
          "Observation for data items in a dataset that do not match an expected pattern or an expected behavior",
          "Identifying interesting relations between different variables in large databases"
        ],
        correct: 0,
        explanation: "Clustering groups records based on structural similarities and proximity in feature space."
      },
      {
        question: "29. In a relational database management system, the process of structuring database tables to eliminate database anomalies is referred to as",
        options: ["Non-normalization", "Normal table structuring", "Normalization", "Elimination"],
        correct: 2,
        explanation: "Normalization minimizes redundancy and avoids insertion, update, and deletion anomalies."
      },
      {
        question: "30. Which of the following items can be classified under internet of things (IoT)?",
        options: [
          "Supercomputers and mainframes",
          "Desktop and laptop computers",
          "Wearable fitness devices, and smart footballs",
          "Smart phones and tablets"
        ],
        correct: 2,
        explanation: "Connected edge physical devices like wearables and smart objects constitute the IoT ecosystem."
      },
      {
        question: "31. Data mining is also referred to as",
        options: [
          "Knowledge discovery in data",
          "Knowledge management system",
          "Data visualization system",
          "Descriptive analytics"
        ],
        correct: 0,
        explanation: "Data Mining is synonymously referred to as Knowledge Discovery in Data (KDD)."
      },
      {
        question: "32. One of the database technologies that has emerged in response to the big data revolution is the",
        options: [
          "Flat file database management systems",
          "Large data management systems",
          "Relational database management systems",
          "Silo database management systems"
        ],
        correct: 2,
        explanation: "Relational database systems evolved to manage structured operational data (while NoSQL systems expanded for unstructured Big Data)."
      },
      {
        question: "33. In respect of 1NF, every table should have a column which provides values that guarantees uniqueness of records in the table. Such a column is referred to as",
        options: ["Unique column", "Separate field", "Primary key column", "Foreign key column"],
        correct: 2,
        explanation: "A Primary Key is a unique identifier assigned to distinctly identify each record in a relational table."
      },
      {
        question: "34. Relational database management systems are most suitable for the",
        options: [
          "Storing, managing and retrieving of structured big data",
          "Storing, managing and retrieving of unstructured big data",
          "Storing, managing and retrieving of semi-structured big data",
          "Managing of legacy database systems"
        ],
        correct: 0,
        explanation: "RDBMS platforms excel at managing highly structured relational schema and transactional data."
      },
      {
        question: "35. In 2NF, in summary, requires that all non-key attributes fully depend on the",
        options: ["Primary key", "Foreign key"],
        correct: 0,
        explanation: "Second Normal Form (2NF) mandates that all non-key columns must be fully functionally dependent on the primary key."
      }
    ]
  }
];

// App State
let currentSetIndex = 0;
let currentQuestionIndex = 0;

// Track user selections: userAnswers[setIndex][questionIndex] = chosenIndex
let userAnswers = [
  Array(20).fill(null),
  Array(15).fill(null)
];

// DOM Element References
const totalProgressEl = document.getElementById('total-progress');
const overallAccuracyEl = document.getElementById('overall-accuracy');
const currentSetScoreEl = document.getElementById('current-set-score');
const progressBarEl = document.getElementById('progress-bar');
const questionNumberEl = document.getElementById('question-number');
const setTitleBadgeEl = document.getElementById('set-title-badge');
const questionTextEl = document.getElementById('question-text');
const optionsGridEl = document.getElementById('options-grid');
const explanationBoxEl = document.getElementById('explanation-box');
const explanationTextEl = document.getElementById('explanation-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function initApp() {
  renderQuestion();
  updateLedger();
}

function renderQuestion() {
  const currentSet = quizData[currentSetIndex];
  const q = currentSet.questions[currentQuestionIndex];
  const selectedOption = userAnswers[currentSetIndex][currentQuestionIndex];

  setTitleBadgeEl.textContent = currentSet.setTitle;
  questionNumberEl.textContent = `Question ${currentQuestionIndex + 1} of ${currentSet.questions.length}`;
  questionTextEl.textContent = q.question;
  
  const progressPercent = ((currentQuestionIndex + 1) / currentSet.questions.length) * 100;
  progressBarEl.style.width = `${progressPercent}%`;

  optionsGridEl.innerHTML = '';
  q.options.forEach((optText, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = `${String.fromCharCode(65 + index)}. ${optText}`;

    if (selectedOption !== null) {
      btn.disabled = true;
      if (index === q.correct) {
        btn.classList.add('show-correct');
      }
      if (index === selectedOption) {
        if (selectedOption === q.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(index);
    }

    optionsGridEl.appendChild(btn);
  });

  if (selectedOption !== null) {
    explanationTextEl.textContent = q.explanation;
    explanationBoxEl.classList.add('active');
  } else {
    explanationBoxEl.classList.remove('active');
  }

  prevBtn.disabled = (currentQuestionIndex === 0);
  if (currentQuestionIndex === currentSet.questions.length - 1) {
    nextBtn.textContent = (currentSetIndex < quizData.length - 1) ? "Next Set" : "Finish Quiz";
  } else {
    nextBtn.textContent = "Next Question";
  }
}

function selectOption(optionIndex) {
  userAnswers[currentSetIndex][currentQuestionIndex] = optionIndex;
  renderQuestion();
  updateLedger();
}

function updateLedger() {
  let totalAnswered = 0;
  let totalCorrect = 0;
  let currentSetCorrect = 0;

  userAnswers.forEach((setAns, sIdx) => {
    setAns.forEach((ans, qIdx) => {
      if (ans !== null) {
        totalAnswered++;
        const isCorrect = (ans === quizData[sIdx].questions[qIdx].correct);
        if (isCorrect) totalCorrect++;

        if (sIdx === currentSetIndex && isCorrect) {
          currentSetCorrect++;
        }
      }
    });
  });

  totalProgressEl.textContent = `${totalAnswered} / 35`;
  const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  overallAccuracyEl.textContent = `${accuracy}%`;
  currentSetScoreEl.textContent = `${currentSetCorrect} / ${quizData[currentSetIndex].questions.length}`;
}

function switchSet(setIdx) {
  currentSetIndex = setIdx;
  currentQuestionIndex = 0;
  
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach((tab, index) => {
    tab.classList.toggle('active', index === setIdx);
  });

  renderQuestion();
  updateLedger();
}

function nextQuestion() {
  const currentSet = quizData[currentSetIndex];
  if (currentQuestionIndex < currentSet.questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else if (currentSetIndex < quizData.length - 1) {
    switchSet(currentSetIndex + 1);
  } else {
    alert(`Quiz Complete! Your overall accuracy is ${overallAccuracyEl.textContent} across 35 questions.`);
  }
}

function prevQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
}

function resetCurrentSet() {
  if (confirm("Are you sure you want to reset your answers for this set?")) {
    const currentSetLength = quizData[currentSetIndex].questions.length;
    userAnswers[currentSetIndex] = Array(currentSetLength).fill(null);
    currentQuestionIndex = 0;
    renderQuestion();
    updateLedger();
  }
}

initApp();
</script>
</body>
</html>
