<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantitative Methods - Interactive Quiz Ledger</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --incorrect: #dc2626;
      --incorrect-bg: #fef2f2;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      font-size: 1.875rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    /* Score Ledger Bar */
    .ledger-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .ledger-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .ledger-card h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ledger-card .score {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    /* Set Navigation Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: #f1f5f9;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Quiz Area */
    .quiz-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .question-number {
      font-weight: bold;
      color: var(--primary);
    }

    .question-text {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 14px 18px;
      text-align: left;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect);
      color: var(--incorrect);
      font-weight: 600;
    }

    .option-btn.show-correct {
      border-color: var(--correct);
      background-color: var(--correct-bg);
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 8px;
      background-color: #f1f5f9;
      border-left: 4px solid var(--primary);
      display: none;
    }

    .explanation-box.active {
      display: block;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Quantitative Methods Quiz Ledger</h1>
    <p>Comprehensive assessment platform across 4 core module sets (80 questions)</p>
  </header>

  <!-- Ledger Summary Overview -->
  <div class="ledger-summary">
    <div class="ledger-card">
      <h3>Overall Progress</h3>
      <div class="score" id="total-progress">0 / 80</div>
    </div>
    <div class="ledger-card">
      <h3>Overall Accuracy</h3>
      <div class="score" id="overall-accuracy">0%</div>
    </div>
    <div class="ledger-card">
      <h3>Current Set Score</h3>
      <div class="score" id="current-set-score">0 / 20</div>
    </div>
  </div>

  <!-- Tabs for 4 Sets -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchSet(0)">Set 1: Time Series & Indexing</button>
    <button class="tab-btn" onclick="switchSet(1)">Set 2: Forecasting Methods</button>
    <button class="tab-btn" onclick="switchSet(2)">Set 3: Regression & Price Indexes</button>
    <button class="tab-btn" onclick="switchSet(3)">Set 4: Econometric Models</button>
  </div>

  <!-- Quiz Card Area -->
  <div class="quiz-card">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-header">
      <span class="question-number" id="question-number">Question 1 of 20</span>
      <span id="set-title-badge" style="font-size: 0.85rem; color: var(--text-muted);">Set 1</span>
    </div>

    <div class="question-text" id="question-text">Loading question...</div>

    <div class="options-grid" id="options-grid"></div>

    <div class="explanation-box" id="explanation-box">
      <strong>Explanation / Solution:</strong>
      <p id="explanation-text"></p>
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="controls">
    <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
    <button class="btn btn-secondary" onclick="resetCurrentSet()">Reset Set</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Next Question</button>
  </div>
</div>

// App State Management
let currentSetIndex = 0;
let currentQuestionIndex = 0;

// User Response Tracking Matrix: userAnswers[setIndex][questionIndex] = chosenOptionIndex
let userAnswers = Array(4).fill(null).map(() => Array(20).fill(null));

// DOM Elements
const totalProgressEl = document.getElementById('total-progress');
const overallAccuracyEl = document.getElementById('overall-accuracy');
const currentSetScoreEl = document.getElementById('current-set-score');
const progressBarEl = document.getElementById('progress-bar');
const questionNumberEl = document.getElementById('question-number');
const setTitleBadgeEl = document.getElementById('set-title-badge');
const questionTextEl = document.getElementById('question-text');
const optionsGridEl = document.getElementById('options-grid');
const explanationBoxEl = document.getElementById('explanation-box');
const explanationTextEl = document.getElementById('explanation-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// Initialize App
function initApp() {
  renderQuestion();
  updateLedger();
}

// Render Current Question
function renderQuestion() {
  const currentSet = quizData[currentSetIndex];
  const q = currentSet.questions[currentQuestionIndex];
  const selectedOption = userAnswers[currentSetIndex][currentQuestionIndex];

  // Header and Progress Updates
  setTitleBadgeEl.textContent = currentSet.setTitle;
  questionNumberEl.textContent = `Question ${currentQuestionIndex + 1} of ${currentSet.questions.length}`;
  questionTextEl.textContent = q.question;
  
  // Progress Bar
  const progressPercent = ((currentQuestionIndex + 1) / currentSet.questions.length) * 100;
  progressBarEl.style.width = `${progressPercent}%`;

  // Options Rendering
  optionsGridEl.innerHTML = '';
  q.options.forEach((optText, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = `${String.fromCharCode(65 + index)}. ${optText}`;

    if (selectedOption !== null) {
      btn.disabled = true;
      if (index === q.correct) {
        btn.classList.add('show-correct');
      }
      if (index === selectedOption) {
        if (selectedOption === q.correct) {
          btn.classList.add('selected-correct');
        } else {
          btn.classList.add('selected-incorrect');
        }
      }
    } else {
      btn.onclick = () => selectOption(index);
    }

    optionsGridEl.appendChild(btn);
  });

  // Explanation Box Rendering
  if (selectedOption !== null) {
    explanationTextEl.textContent = q.explanation;
    explanationBoxEl.classList.add('active');
  } else {
    explanationBoxEl.classList.remove('active');
  }

  // Button States
  prevBtn.disabled = (currentQuestionIndex === 0);
  if (currentQuestionIndex === currentSet.questions.length - 1) {
    nextBtn.textContent = (currentSetIndex < quizData.length - 1) ? "Next Set" : "Finish Quiz";
  } else {
    nextBtn.textContent = "Next Question";
  }
}

// Select Option Event
function selectOption(optionIndex) {
  userAnswers[currentSetIndex][currentQuestionIndex] = optionIndex;
  renderQuestion();
  updateLedger();
}

// Update Global Score Ledger
function updateLedger() {
  let totalAnswered = 0;
  let totalCorrect = 0;
  let currentSetCorrect = 0;
  let currentSetAnswered = 0;

  userAnswers.forEach((setAns, sIdx) => {
    setAns.forEach((ans, qIdx) => {
      if (ans !== null) {
        totalAnswered++;
        const isCorrect = (ans === quizData[sIdx].questions[qIdx].correct);
        if (isCorrect) totalCorrect++;

        if (sIdx === currentSetIndex) {
          currentSetAnswered++;
          if (isCorrect) currentSetCorrect++;
        }
      }
    });
  });

  // Update DOM Ledger elements
  totalProgressEl.textContent = `${totalAnswered} / 80`;
  const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  overallAccuracyEl.textContent = `${accuracy}%`;
  currentSetScoreEl.textContent = `${currentSetCorrect} / 20`;
}

// Navigation Functions
function switchSet(setIdx) {
  currentSetIndex = setIdx;
  currentQuestionIndex = 0;
  
  // Update Active Tab Styling
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach((tab, index) => {
    tab.classList.toggle('active', index === setIdx);
  });

  renderQuestion();
  updateLedger();
}

function nextQuestion() {
  const currentSet = quizData[currentSetIndex];
  if (currentQuestionIndex < currentSet.questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else if (currentSetIndex < quizData.length - 1) {
    switchSet(currentSetIndex + 1);
  } else {
    alert(`Quiz Completed! Your total score is ${overallAccuracyEl.textContent} across 80 questions.`);
  }
}

function prevQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuestion();
  }
}

function resetCurrentSet() {
  if (confirm("Are you sure you want to reset your answers for this set?")) {
    userAnswers[currentSetIndex] = Array(20).fill(null);
    currentQuestionIndex = 0;
    renderQuestion();
    updateLedger();
  }
}

// Start
initApp();
</script>
